# Serves the static site and forwards API calls to the protected API container, so the browser
# talks to one origin and the API needs no CORS for it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # /health is the API's: a site whose API is down is not healthy either.
    location = /health {
        proxy_pass http://api:8300;
    }

    location /api/ {
        proxy_pass http://api:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
