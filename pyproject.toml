[project]
name = "pyarmor-demo"
version = "0.1.0"
description = "A hands-on workshop for protecting Python applications with PyArmor: obfuscate a FastAPI app, run it, ship it in Docker, and learn where the security boundary really is."
readme = "README.md"
# The Docker image and CI use 3.12. PyArmor output only runs on the Python minor version that
# built it, so build and run with the same interpreter.
requires-python = ">=3.10,<3.14"
# Direct dependencies are pinned exactly, so every attendee runs the same versions.
# requirements.txt pins the full runtime tree with hashes (generated from uv.lock, used by Docker).
dependencies = [
    "fastapi==0.142.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
]
# The obfuscator. Needed on the build machine only, never in the runtime image.
protect = [
    "pyarmor==9.2.7",
]

[tool.uv]
package = false
default-groups = ["dev", "protect"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", "web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette 1.x suggests httpx2 for its test client; httpx 0.28 still works and is kept for now.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
