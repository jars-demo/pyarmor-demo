# A template for running the protected API on your own Linux server, behind Caddy with HTTPS.
#
#   cp deploy/.env.example deploy/.env      # set API_DOMAIN, point its DNS at the server
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# See workshop/10-deployment.md for every step.
name: pyarmor-demo-prod

services:
  api:
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    image: pyarmor-demo:prod
    environment:
      PYARMOR_DEMO_ENV: production
      PYARMOR_DEMO_LOG_LEVEL: ${PYARMOR_DEMO_LOG_LEVEL:-info}
    # No published ports: only Caddy, on the internal network, can reach the API.
    expose:
      - "8300"
    networks: [internal]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

networks:
  internal:
    internal: true
  public: {}

volumes:
  caddy_data: {}
  caddy_config: {}
