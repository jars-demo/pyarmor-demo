name: CI

# original tests → obfuscate → protected tests → Docker build → smoke test → scan, plus the website.
# Every run uses the PyArmor trial a few times (backend job + image build). The free tier allows
# CI/CD use within its monthly limits; see workshop/04-pyarmor-setup.md. No license or secret is
# needed. With a paid license, add the regfile as an encrypted secret (see AGENTS.md).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, test, protect, verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: requirements.txt matches uv.lock
        run: |
          uv export --frozen --no-default-groups --no-emit-project --format requirements-txt -o /tmp/requirements.txt -q
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
      - name: Tests (original source)
        run: uv run pytest
      - name: Obfuscate with PyArmor
        run: uv run python scripts/obfuscate.py
      - name: Verify the protected build and run the tests against it
        run: uv run python scripts/verify.py --tests
      - name: Smoke-test the protected API over HTTP
        run: |
          cd build/protected
          uv run python -m app &
          cd ../..
          uv run python scripts/smoke.py --expect-build protected
      - name: Dependency audit
        run: uvx pip-audit==2.10.0 -r requirements.txt

  docker:
    name: Docker · build, smoke test, inspect, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start both services
        run: docker compose up -d --build --wait
      - name: Smoke test (API directly, and through the website's proxy)
        run: |
          python3 scripts/smoke.py --expect-build protected
          python3 scripts/smoke.py --url http://localhost:3300 --expect-build protected
          curl -fsS http://localhost:3300/workshop/ > /dev/null
      - name: The image holds no source, no PyArmor, and runs as non-root
        run: |
          docker run --rm --entrypoint sh pyarmor-demo:local -c '
            set -e
            test ! -e /src
            ! command -v pyarmor
            ! python -c "import pyarmor" 2>/dev/null
            test "$(id -u)" = 10001
            for f in $(find /srv/app/app -name "*.py"); do
              head -1 "$f" | grep -q "^# Pyarmor" || { echo "not obfuscated: $f"; exit 1; }
            done
            echo "OK: $(find /srv/app/app -name "*.py" | wc -l) obfuscated modules, no source, no PyArmor"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: pyarmor-demo:local
          format: spdx-json
          artifact-name: pyarmor-demo-sbom.spdx.json
      - name: Vulnerability scan (fixable HIGH and CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pyarmor-demo:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0

  frontend:
    name: Frontend · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build the Vercel site (static flavour)
        run: npm run build:static
      - name: Build the full app (Docker flavour)
        run: npm run build
